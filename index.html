  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0; min-height: 100vh;

  .rgrid { padding: 6px 16px 14px; }

  .rrow:last-child { border-bottom: 0; }

  .rrow .v { flex: 1; color: #1f2733; font-weight: 500; word-break: break-all; }
  .empty { text-align: center; padding: 26px 10px; color: #98a1b0; font-size: 14px; line-height: 1.8; }
  .empty b { display: block; font-size: 34px; margin-bottom: 8px; }
  .cands { margin-top: 16px; }

  .cand {
    padding: 13px 16px; border: 1px solid #e6ebf2; border-radius: 12px;

  .back-wrap { text-align: center; margin-top: 4px; }

/* =========================================================================
 *  以下为查询逻辑，一般不需要改动
 * ========================================================================= */
(function () {
  var $ = function (id) { return document.getElementById(id); };

  document.title = CONFIG.title;
  $("uiTitle").textContent = CONFIG.title;
  $("uiSubtitle").textContent = CONFIG.subtitle;
  $("uiNameLabel").textContent = CONFIG.nameLabel || "姓名";
  $("uiTip").textContent = CONFIG.tip || "";
  $("uiFoot").textContent = CONFIG.foot || "";
  $("nameInput").placeholder = "请输入" + (CONFIG.nameLabel || "姓名");

  function trim(s) { return (s || "").replace(/\s+/g, ""); }
  function norm(s) { return (s || "").replace(/[\s\u3000]/g, "").toLowerCase(); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function isEmpty(v) { return v === undefined || v === null || String(v).trim() === ""; }

  function renderPerson(p) {
    var html = '<div class="rcard"><div class="rname">' + esc(p.name) +
               '<span class="rtag">查询结果</span></div><div class="rgrid">';
    (CONFIG.showFields || []).forEach(function (f) {
      if (isEmpty(p[f.key])) return;          // 空字段自动隐藏
      html += '<div class="rrow"><div class="k">' + esc(f.label) +
              '</div><div class="v">' + esc(p[f.key]) + '</div></div>';
    });
    return html + '</div></div>';
  }

  function summary(p) {
    var parts = [];
    (CONFIG.candFields || []).forEach(function (k) { if (!isEmpty(p[k])) parts.push(p[k]); });
    return parts.length ? parts.join(" · ") : "点击查看详情";
  }

  function renderCandidates(list, hint) {
    var html = '<div class="cands"><div class="cands-title">' + esc(hint) + '</div>';
    list.forEach(function (p, i) {
      html += '<div class="cand" data-i="' + i + '"><span class="cn">' + esc(p.name) +
              '</span><span class="ci">' + esc(summary(p)) + ' ›</span></div>';
    });
    $("output").innerHTML = html + '</div>';

    var nodes = $("output").querySelectorAll(".cand");
    for (var i = 0; i < nodes.length; i++) {
      (function (idx) {
        nodes[idx].onclick = function () {
          $("output").innerHTML = '<div class="result">' + renderPerson(list[idx]) + '</div>' +
            '<div class="back-wrap"><button class="btn-plain" id="backBtn">返回重新查询</button></div>';
          $("backBtn").onclick = reset;
        };
      })(i);
    }
  }

  function reset() {
    $("nameInput").value = "";
    $("output").innerHTML = "";
  }

  function doSearch() {
    var out = $("output");
    var q = trim($("nameInput").value);
    if (!q) { out.innerHTML = '<div class="empty"><b>✏️</b>请先输入' + esc(CONFIG.nameLabel || "姓名") + '</div>'; return; }

    var nq = norm(q);
    var exact = STUDENT_DATA.filter(function (p) { return norm(p.name) === nq; });

    if (exact.length === 1) { out.innerHTML = '<div class="result">' + renderPerson(exact[0]) + '</div>'; return; }
    if (exact.length > 1) { renderCandidates(exact, "找到 " + exact.length + " 位同名学员，请点击本人查看"); return; }

    // 没有完全一致的，退一步做模糊匹配（输入"张"也能列出所有姓张的）
    var fuzzy = STUDENT_DATA.filter(function (p) { return norm(p.name).indexOf(nq) > -1; });
    if (fuzzy.length === 1) { out.innerHTML = '<div class="result">' + renderPerson(fuzzy[0]) + '</div>'; return; }
    if (fuzzy.length > 1) { renderCandidates(fuzzy, "找到 " + fuzzy.length + " 位相关学员，请点击本人查看"); return; }

    out.innerHTML = '<div class="empty"><b>🔍</b>未查询到匹配的信息<br>请核对姓名后重新输入，或联系现场工作人员</div>';
  }

  $("searchBtn").onclick = doSearch;
  $("nameInput").addEventListener("keydown", function (e) { if (e.key === "Enter") doSearch(); });
})();
</script>
